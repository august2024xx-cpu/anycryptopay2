<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Coin Checkout</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: #000; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: Arial, sans-serif; color: white; }
        .container { width: 100%; max-width: 600px; background: #111; padding: 30px; border-radius: 20px; border: 1px solid #333; }
        h1 { text-align: center; color: #39ff14; font-size: 28px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #fff; }
        input, select { width: 100%; padding: 14px; font-size: 18px; background: #222; border: 2px solid #39ff14; color: white; border-radius: 10px; }
        button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .btn-web3 { background: #39ff14; color: #000; }
        .btn-nowpayments { background: linear-gradient(135deg, #f7931a, #ffb84d); color: #000; }
        button:hover { opacity: 0.9; }
        .divider { text-align: center; margin: 20px 0; color: #ff9800; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍕 PIZZA COIN CHECKOUT 🍕</h1>
    
    <div class="form-group">
        <label for="buyerEmail">Your Email Address:</label>
        <input type="email" id="buyerEmail" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
        <label for="polygonAddress">Your Polygon Wallet Address:</label>
        <input type="text" id="polygonAddress" placeholder="0x..." required>
    </div>

    <div class="form-group">
        <label for="pzzcAmount">Amount (USD / PZZC):</label>
        <input type="number" id="pzzcAmount" value="10" min="1" step="0.01" required>
    </div>

    <!-- Option 1: Direct Web3 USDC Payment -->
    <button class="btn-web3" onclick="payWithDirectWeb3()">Complete Purchase (Polygon Web3)</button>

    <div class="divider">--- OR ---</div>

    <!-- Option 2: NOWPayments Gateway -->
    <button class="btn-nowpayments" onclick="payWithNowPayments()">Pay with Crypto (NOWPayments)</button>
</div>

<!-- Ethers.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
    const BACKEND_URL = "https://pizza-backend-8if7.onrender.com";
    const MERCHANT_WALLET = "0x9e63CDc3D66714f0FCe5B3347139E117a04A75b3";
    const USDC_POLYGON = "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174";

    async function payWithDirectWeb3() {
        const email = document.getElementById("buyerEmail").value.trim();
        const polygonAddress = document.getElementById("polygonAddress").value.trim();
        const amount = document.getElementById("pzzcAmount").value.trim();

        if (!email || !polygonAddress || !amount) {
            alert("Please fill in all fields.");
            return;
        }

        if (!window.ethereum) {
            alert("Please open this page in MetaMask or a Web3 browser.");
            return;
        }

        try {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            alert("Please approve the USDC transfer in your wallet...");

            const erc20Abi = ["function transfer(address to, uint256 value) returns (bool)"];
            const usdcContract = new ethers.Contract(USDC_POLYGON, erc20Abi, signer);
            
            const parsedAmount = ethers.parseUnits(amount, 6);
            const tx = await usdcContract.transfer(MERCHANT_WALLET, parsedAmount);
            
            alert("Transaction submitted! Waiting for confirmation...");
            const receipt = await tx.wait();

            const response = await fetch(`${BACKEND_URL}/api/verify-usdc-order`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email,
                    polygonAddress,
                    pzzcAmount: amount,
                    paymentCrypto: "USDC",
                    txHash: receipt.hash
                })
            });

            const data = await response.json();
            if (data.success) {
                alert("Payment successful! PZZC tokens have been sent to your wallet.");
            } else {
                alert("Error processing order: " + (data.error || "Unknown error"));
            }
        } catch (err) {
            console.error(err);
            alert("Payment failed: " + (err.reason || err.message));
        }
    }

    async function payWithNowPayments() {
        const email = document.getElementById("buyerEmail").value.trim();
        const polygonAddress = document.getElementById("polygonAddress").value.trim();
        const amount = document.getElementById("pzzcAmount").value.trim();

        if (!email || !polygonAddress || !amount) {
            alert("Please fill in all fields.");
            return;
        }

        alert("Redirecting to NOWPayments secure checkout...");
        
        // Example redirect using standard GET query parameters to a backend invoice generator route
        window.location.href = `${BACKEND_URL}/api/create-invoice?amount=${amount}&email=${encodeURIComponent(email)}&wallet=${encodeURIComponent(polygonAddress)}`;
    }
</script>

</body>
</html>
